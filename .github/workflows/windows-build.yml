name: "Windows Build"

# Builds the Windows x86_64 installer (NSIS .exe) from the current branch and
# uploads it as a workflow artifact. Manual dispatch only.
#
# The signCommand (Azure Trusted Signing) was removed from tauri.conf.json
# because this fork doesn't have the credentials. Windows SmartScreen will
# show a warning on first run — click "More info → Run anyway".

on:
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      sign-binaries: false
      upload-artifacts: true
    secrets: inherit
