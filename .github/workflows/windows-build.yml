name: "Windows Build"

# Builds the Windows x86_64 installer (NSIS .exe) from the current branch.
# Manual dispatch only. Produces an UNSIGNED binary.
#
# Key differences from the reusable build.yml:
# 1. Removes signCommand from tauri.conf.json (no Azure Trusted Signing)
# 2. Does NOT set TAURI_SIGNING_PRIVATE_KEY (skips updater signing)
# 3. Sets CARGO_TARGET_DIR=D:\t (avoids MSBuild FTK1011 long-path errors)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: D:\t
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-latest-x86_64-pc-windows-msvc

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install ONNX Runtime (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ORT_VERSION = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ORT_VERSION/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      - name: Patch tauri.conf.json (remove signCommand)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -Depth 99
          $conf.bundle.windows.PSObject.Properties.Remove('signCommand')
          $conf | ConvertTo-Json -Depth 99 | Set-Content src-tauri/tauri.conf.json

      - name: Install frontend dependencies
        run: bun install

      - name: Build with Tauri (no updater signing)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately NOT setting TAURI_SIGNING_PRIVATE_KEY — Tauri will
          # skip the updater signature step. The bundle (exe/msi) is still
          # produced; only latest.json signing is skipped.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handy-windows-x86_64
          path: |
            D:\t\release\bundle\nsis\*.exe
            D:\t\release\bundle\msi\*.msi
          retention-days: 30
